name: Build Spork iOS Dylib
on: [push, pull_request]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos

      - name: Install ldid
        run: brew install ldid

      - name: Build Luau Static Library
        run: |
          # Clone Luau source
          git clone --depth 1 https://github.com/luau-lang/luau.git
          cd luau
          # Create a build directory for CMake
          mkdir build_ios && cd build_ios
          # Configure CMake for iOS ARM64
          cmake .. -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_CLI=OFF
          # Build the static libraries (Luau.Compiler and Luau.VM)
          make -j$(sysctl -n hw.ncpu)
          # Copy the .a files to the Theos project root for linking
          cp libLuau.Compiler.a libLuau.VM.a ${{ github.workspace }}/

      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          export TARGET_CODESIGN=$(which ldid)
          make package FINALPACKAGE=1

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: Spork-UI-Dylib
          path: .theos/obj/**/*.dylib

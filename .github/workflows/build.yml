name: Build Spork iOS Dylib
on: [push, pull_request]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clone and Patch Dobby
        run: |
          git clone --depth 1 --recursive https://github.com/jmpews/Dobby.git Dobby
          # Move the system includes out of extern "C" (fixes Xcode 26 module error).
          perl -0777 -pi -e 's/#ifdef __cplusplus\nextern "C" \{\n#endif\n\n(#include <stdbool\.h>\n#include <stdint\.h>\n#include <sys\/types\.h>\n)/$1\n#ifdef __cplusplus\nextern "C" {\n#endif\n/' Dobby/include/dobby.h
          head -12 Dobby/include/dobby.h
          awk '/#include <sys\/types.h>/{i=NR} /extern "C"/ && !e{e=NR} END{exit !(i && e && i<e)}' Dobby/include/dobby.h

      - name: Build Dobby (static, iOS arm64 + arm64e)
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          for ARCH in arm64 arm64e; do
            cmake -S Dobby -B Dobby/build/$ARCH \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_SYSTEM_PROCESSOR=$ARCH \
              -DCMAKE_OSX_ARCHITECTURES=$ARCH \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
              -DCMAKE_OSX_SYSROOT="$SDK" \
              -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DPlugin.SymbolResolver=ON \
              -DDOBBY_DEBUG=OFF
            cmake --build Dobby/build/$ARCH --target dobby_static -j 4
          done
          mkdir -p Dobby/build/universal
          lipo -create Dobby/build/arm64/libdobby.a Dobby/build/arm64e/libdobby.a \
               -output Dobby/build/universal/libdobby.a
          lipo -info Dobby/build/universal/libdobby.a

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install ldid
        run: brew install ldid

      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          export TARGET_CODESIGN=$(which ldid)
          make package FINALPACKAGE=1

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: Spork-UI-Dylib
          path: |
            .theos/obj/**/*.dylib

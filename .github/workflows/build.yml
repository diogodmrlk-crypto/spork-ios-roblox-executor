name: Build Spork iOS Dylib
on: [push, pull_request]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clone Dobby Library
        run: |
          git clone --recursive https://github.com/jmpews/Dobby.git Dobby

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "THEOS_MAKE_PATH=$HOME/theos/makefiles" >> $GITHUB_ENV

      - name: Install ldid
        run: brew install ldid

      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          export TARGET_CODESIGN=$(which ldid)
          make package FINALPACKAGE=1

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: Spork-UI-Dylib
          path: .theos/obj/**/*.dylib

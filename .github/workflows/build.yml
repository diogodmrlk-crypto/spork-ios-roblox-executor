name: Build Spork iOS Dylib
on: [push, pull_request]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos

      - name: Install ldid
        run: brew install ldid

      - name: Build Luau Static Library
        run: |
          git clone --depth 1 https://github.com/luau-lang/luau.git
          cd luau
          mkdir build_ios && cd build_ios
          
          # Build for BOTH arm64 and arm64e architectures
          cmake .. -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES="arm64;arm64e" -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_CLI=OFF -DLUAU_BUILD_TESTS=OFF
          
          make -j$(sysctl -n hw.ncpu)
          
          # Copy the fat libraries to the project root
          cp libLuau.Compiler.a libLuau.VM.a libLuau.Ast.a libLuau.Common.a libLuau.Bytecode.a ${{ github.workspace }}/

      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          export TARGET_CODESIGN=$(which ldid)
          make package FINALPACKAGE=1

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: Spork-UI-Dylib
          path: .theos/obj/**/*.dylib
